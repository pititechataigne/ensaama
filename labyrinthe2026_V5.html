  <!-- ===================================================== -->
  <!-- CAMERA -->
  <!-- ===================================================== -->

      distance="4"
      decay="1.5">
    </a-light>

  </a-camera>


  <!-- ===================================================== -->
  <!-- ANIMATION -->
  <!-- ===================================================== -->

  <script>
AFRAME.registerComponent('texture-animation', {

  init() {

    this.items = [];
    this.lastUpdate = 0;

    document.querySelectorAll('.anim').forEach(el => {

      const materialComponent = el.components.material;

      if (!materialComponent || !materialComponent.material) return;

      const material = materialComponent.material;
      const texture = material.map;

      if (!texture) return;

      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      this.items.push({
        texture: texture,
        speed: parseFloat(el.dataset.speed) || 0.2,
        amount: parseFloat(el.dataset.amount) || 0.03,
        direction: parseFloat(el.dataset.direction) || 1,
        time: Math.random() * 10,
        offset: texture.offset.x
      });

    });

  },

  tick(time, delta) {

    // Environ 30 mises à jour par seconde.
    // Suffisant pour une animation de texture fluide
    // et beaucoup moins coûteux pour le casque VR.

    if (time - this.lastUpdate < 33) return;

    this.lastUpdate = time;

    const dt = 0.033;

    for (let i = 0; i < this.items.length; i++) {

      const item = this.items[i];

      item.time += dt;

      item.texture.offset.x =
        item.offset +
        Math.sin(item.time * item.speed) *
        item.amount *
        item.direction;

    }

  }

});

 document
  .querySelector('a-scene')
  .setAttribute('texture-animation', '');
</script>

</a-scene>

</html>
