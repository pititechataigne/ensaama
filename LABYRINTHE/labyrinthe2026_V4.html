<!DOCTYPE html>
<html lang="fr">

<head>

  <title>Labyrinthe</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<body>

    width="4"
    height="3">
  </a-plane>


  <a-plane

  </a-plane>

  <a-plane class="anim"
    data-speed="0.30"
    data-amount="0.030"

    material="src:#img3;shader:standard;side:double;transparent:true;opacity:0.5"

    rotation="0 -90 0"

  <a-plane

    scale="0.74 1 1">
  </a-plane>

  <a-plane class="anim"
    data-speed="0.18"

  </a-plane>


  <a-plane

    scale="0.67 1 1">
  </a-plane>

    position="-0.50449 1.48425 -0.99907"

  <!-- SOL -->

  </a-plane>

  <a-plane

  <!-- ===================================================== -->
  <!-- ENVIRONNEMENT -->
  <!-- ===================================================== -->

  <a-sky color="#000"></a-sky>

  <a-light
    type="ambient"
    color="#444"
    intensity="0.15">
  </a-light>


  <!-- ===================================================== -->
  <!-- CAMERA -->
  <!-- ===================================================== -->

  <a-camera position="0 1.6 0">

    <a-light
      type="point"
      color="#FFD27F"
      intensity="3"
      distance="4"
      decay="1.5">
    </a-light>

  </a-camera>


  <!-- ===================================================== -->
  <!-- ANIMATION -->
  <!-- ===================================================== -->

  <script>

    AFRAME.registerComponent('texture-animation', {

      init() {

        this.items = [];

        document.querySelectorAll('.anim').forEach(el => {

          const material = el.components.material?.material;

          if (!material || !material.map) return;

          const texture = material.map;

          texture.wrapS = THREE.RepeatWrapping;

          this.items.push({
            texture: texture,
            speed: parseFloat(el.dataset.speed),
            amount: parseFloat(el.dataset.amount),
            direction: parseFloat(el.dataset.direction),
            time: Math.random() * 10000,
            offset: texture.offset.x
          });

        });

      },

      tick(time, delta) {

        const dt = delta * 0.001;

        for (let i = 0; i < this.items.length; i++) {

          const item = this.items[i];

          item.time += dt;

          item.texture.offset.x =
            item.offset +
            Math.sin(item.time * item.speed) *
            item.amount *
            item.direction;

        }

      }

    });

    document.querySelector('a-scene')
      .setAttribute('texture-animation', '');

  </script>

</a-scene>

</body>
</html>
