  <script>
  // ==========================================
  // PARAMÈTRES DES PROJECTIONS ALÉATOIRES
  // ==========================================

  const configProjections = {
    nombre: 12, // Nombre de projections visibles simultanément

    // Zone d'apparition (en mètres)
    xMin: -2.5,
    xMax: 2.5,
    yMin: 0.3,
    yMax: 6,
    zMin: 0.65,
    zMax: 1.2,

    // Dimensions de base
    largeur: 1.5,
    hauteur: 1,

    // Rotation aléatoire (en degrés)
    rotationX: 20,
    rotationY: 20,
    rotationZ: 15,

    // Taille aléatoire
    tailleMin: 0.7,
    tailleMax: 3,

    // Opacité
    opaciteMin: 0.67,
    opaciteMax: 0.90,

    // Durée d'affichage et d'attente (en millisecondes)
    apparitionMin: 3000,  // 2 secondes
    apparitionMax: 8000,  // 6 secondes
    attenteMin: 10000,      // 0,5 seconde
    attenteMax: 4000,     // 3 secondes

    // Position de référence des rotations
    rotationBaseX: 22.3,
    rotationBaseY: -8.3,
    rotationBaseZ: 1.35
  };

  // Images disponibles
  const images = [
    "#explosion-image1",
    "#explosion-image2",
    "#explosion-image3",
    "#explosion-image4",
    "#explosion-image5",
    "#explosion-image6",
    "#explosion-image7"
  ];

  // Nombre aléatoire entre deux valeurs
  function hasard(min, max) {
    return Math.random() * (max - min) + min;
  }

  // Entier aléatoire pour choisir une image
  function choisirImage() {
    return images[Math.floor(Math.random() * images.length)];
  }

  // ==========================================
  // COMPOSANT A-FRAME
  // ==========================================

  AFRAME.registerComponent("random-projections", {
    init: function () {
      this.zone = this.el;
      this.projections = [];

      // Crée les projections initiales
      for (let i = 0; i < configProjections.nombre; i++) {
        const plan = document.createElement("a-plane");

        plan.setAttribute("width", configProjections.largeur);
        plan.setAttribute("height", configProjections.hauteur);

        plan.setAttribute("material", {
          shader: "flat",
          side: "double",
          transparent: true,
          depthWrite: false,
          opacity: 0,
          blending: "additive"
        });

        this.zone.appendChild(plan);
        this.projections.push(plan);

        this.animerProjection(plan);
      }
    },

    animerProjection: function (plan) {
      const cfg = configProjections;

      // Choix aléatoire de l'image
      plan.setAttribute("src", choisirImage());

      // Position aléatoire dans la zone
      const x = hasard(cfg.xMin, cfg.xMax);
      const y = hasard(cfg.yMin, cfg.yMax);
      const z = hasard(cfg.zMin, cfg.zMax);

      plan.setAttribute("position", `${x} ${y} ${z}`);

      // Rotation aléatoire
      const rx = cfg.rotationBaseX + hasard(-cfg.rotationX, cfg.rotationX);
      const ry = cfg.rotationBaseY + hasard(-cfg.rotationY, cfg.rotationY);
      const rz = cfg.rotationBaseZ + hasard(-cfg.rotationZ, cfg.rotationZ);

      plan.setAttribute("rotation", `${rx} ${ry} ${rz}`);

      // Taille aléatoire
      const taille = hasard(cfg.tailleMin, cfg.tailleMax);
      plan.setAttribute("scale", `${taille} ${taille} 1`);

      // Opacité aléatoire
      const opacite = hasard(cfg.opaciteMin, cfg.opaciteMax);

      // Apparition progressive
      plan.setAttribute("animation__apparition", {
        property: "material.opacity",
        from: 0,
        to: opacite,
        dur: 700,
        easing: "easeInOutQuad"
      });

      // Durée d'affichage
      const duree = hasard(cfg.apparitionMin, cfg.apparitionMax);
      const attente = hasard(cfg.attenteMin, cfg.attenteMax);

      // Disparition, puis nouvelle projection
      setTimeout(() => {
        if (!plan.parentNode) return;

        plan.setAttribute("animation__disparition", {
          property: "material.opacity",
          from: opacite,
          to: 0,
          dur: 700,
          easing: "easeInOutQuad"
        });

        setTimeout(() => {
          if (!plan.parentNode) return;
          this.animerProjection(plan);
        }, 700 + attente);

      }, duree);
    }
  });
</script>
